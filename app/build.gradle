plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.mirobotai'
    compileSdk 35

    signingConfigs {
        debug {
            // Development-only signing key bundled so every GitHub build has
            // the same signature. This lets Android install future APKs as
            // updates instead of forcing an uninstall that wipes saved keys.
            storeFile file('keys/mirobot-dev.jks')
            storePassword 'mirobotdev'
            keyAlias 'mirobotdev'
            keyPassword 'mirobotdev'
        }
    }

    defaultConfig {
        applicationId "com.example.mirobotai"
        minSdk 26
        targetSdk 35
        versionCode 25
        versionName "1.8.1"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
